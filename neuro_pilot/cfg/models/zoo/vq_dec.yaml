# VQGAN Decoder (8x16 discrete tokens -> 128x256 RGB, 42.78M params)

name: vq_dec
family: world

scale: full
scales:
  full: {c1: 128, c2: 256, c4: 512, z_ch: 256, n_embed: 1024, lat_h: 8, lat_w: 16}
  tiny: {c1: 32,  c2: 64,  c4: 64,  z_ch: 32,  n_embed: 64,   lat_h: 2, lat_w: 4}

inputs:
  encoding_indices:
    shape: [1, lat_h, lat_w]
    dtype: int64
    dist: randint
    low: 0
    high: n_embed

outputs:
  big_decoded_img: -1

backbone:
  - [encoding_indices, 1, VectorQuantizer, [n_embed, z_ch, embed]]  # 0  - codebook embed
  - [-1, 1, Conv2d, [z_ch, z_ch, 1, 1, 0]]                          # 1  - post_quant_conv
  - [-1, 1, Conv2d, [z_ch, c4, 3, 1, 1]]                            # 2  - conv_in
  - [-1, 1, VQResBlock, [c4, c4]]                                   # 3  - mid block 1
  - [-1, 1, VQAttnBlock, [c4]]                                      # 4  - mid attn
  - [-1, 1, VQResBlock, [c4, c4]]                                   # 5  - mid block 2
  - [-1, 1, VQResBlock, [c4, c4]]                                   # 6  - up stage 4.0
  - [-1, 1, VQAttnBlock, [c4]]                                      # 7  - stage 4 attn 0
  - [-1, 1, VQResBlock, [c4, c4]]                                   # 8  - up stage 4.1
  - [-1, 1, VQAttnBlock, [c4]]                                      # 9  - stage 4 attn 1
  - [-1, 1, VQResBlock, [c4, c4]]                                   # 10 - up stage 4.2
  - [-1, 1, VQAttnBlock, [c4]]                                      # 11 - stage 4 attn 2
  - [-1, 1, VQUp, [c4]]                                             # 12 - up 2x
  - [-1, 3, VQResBlock, [c4, c2]]                                   # 13 - up stage 3 (3x)
  - [-1, 1, VQUp, [c2]]                                             # 14 - up 4x
  - [-1, 3, VQResBlock, [c2, c2]]                                   # 15 - up stage 2 (3x)
  - [-1, 1, VQUp, [c2]]                                             # 16 - up 8x
  - [-1, 3, VQResBlock, [c2, c1]]                                   # 17 - up stage 1 (3x)
  - [-1, 1, VQUp, [c1]]                                             # 18 - up 16x
  - [-1, 3, VQResBlock, [c1, c1]]                                   # 19 - up stage 0 (3x)

head:
  - [-1, 1, GroupNormAct, [32, c1, 1.0e-6, silu]]                   # 20 - norm_out + SiLU
  - [-1, 1, Conv2d, [c1, 3, 3, 1, 1]]                               # 21 - conv_out (RGB)
