# VQGAN Encoder (128x256 RGB -> 8x16 discrete tokens, 29.63M params)

name: vq_enc
family: world

scale: full
scales:
  full: {c1: 128, c2: 256, c4: 512, z_ch: 256, n_embed: 1024, img_h: 128, img_w: 256}
  tiny: {c1: 32,  c2: 64,  c4: 64,  z_ch: 32,  n_embed: 64,   img_h: 32,  img_w: 64}

inputs:
  big_img: {shape: [1, 3, img_h, img_w], dtype: float32}

outputs:
  encoding_indices: -1

backbone:
  - [big_img, 1, Conv2d, [3, c1, 3, 1, 1]]               # 0  - stem 3x3
  - [-1, 2, VQResBlock, [c1, c1]]                        # 1  - down stage 0 (2x)
  - [-1, 1, VQDown, [c1]]                                # 2  - H/2
  - [-1, 2, VQResBlock, [c1, c1]]                        # 3  - down stage 1 (2x)
  - [-1, 1, VQDown, [c1]]                                # 4  - H/4
  - [-1, 2, VQResBlock, [c1, c2]]                        # 5  - down stage 2 (2x)
  - [-1, 1, VQDown, [c2]]                                # 6  - H/8
  - [-1, 2, VQResBlock, [c2, c2]]                        # 7  - down stage 3 (2x)
  - [-1, 1, VQDown, [c2]]                                # 8  - H/16
  - [-1, 1, VQResBlock, [c2, c4]]                        # 9  - down stage 4.0
  - [-1, 1, VQAttnBlock, [c4]]                           # 10 - stage 4 attn 0
  - [-1, 1, VQResBlock, [c4, c4]]                        # 11 - down stage 4.1
  - [-1, 1, VQAttnBlock, [c4]]                           # 12 - stage 4 attn 1
  - [-1, 1, VQResBlock, [c4, c4]]                        # 13 - mid block 1
  - [-1, 1, VQAttnBlock, [c4]]                           # 14 - mid attn
  - [-1, 1, VQResBlock, [c4, c4]]                        # 15 - mid block 2

head:
  - [-1, 1, GroupNormAct, [32, c4, 1.0e-6, silu]]        # 16 - norm_out + SiLU
  - [-1, 1, Conv2d, [c4, z_ch, 3, 1, 1]]                 # 17 - conv_out
  - [-1, 1, Conv2d, [z_ch, z_ch, 1, 1, 0]]               # 18 - quant_conv
  - [-1, 1, VectorQuantizer, [n_embed, z_ch, quantize]]  # 19 - codebook argmin
