# ViT-AE f8c32 Paired-Camera Autoencoder (42.85M enc / 85.38M dec)

name: ae
family: world

scale: full
scales:
  full:
    embed_dim: 768
    enc_depth: 6
    dec_depth: 12
    num_heads: 6
  tiny:
    embed_dim: 128
    enc_depth: 2
    dec_depth: 2
    num_heads: 4

inputs:
  image_pair: {shape: [1, 6, 128, 256], dtype: float32, dist: rand, low: -1.0, high: 1.0}

outputs:
  latents: 2
  recon: 5

backbone:
  # ViT Encoder (6L on full -> 42.85M params)
  - [image_pair, 1, ViTPatchEmbed, [6, 128, 256, 8, embed_dim]]   # 0: 8x8 patchify + 2D PE
  - [-1, enc_depth, QKNormBlock, [embed_dim, num_heads, 4.0, false, 0, gelu, 1.0e-6]]  # 1: encoder
  - [-1, 1, ViTToLatent, [embed_dim, 32, 16, 32]]                 # 2: [B, 32, 16, 32] latent

head:
  # ViT Decoder (12L on full -> 85.38M params)
  - [2, 1, ViTFromLatent, [32, embed_dim, 16, 32]]                # 3: latent -> tokens + 2D PE
  - [-1, dec_depth, QKNormBlock, [embed_dim, num_heads, 4.0, false, 0, gelu, 1.0e-6]]  # 4: decoder
  - [-1, 1, ViTUnpatch, [embed_dim, 6, 8, 16, 32]]                # 5: [B, 6, 128, 256] recon
