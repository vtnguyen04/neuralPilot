# Dual-camera E2E Planner Large (ConvNeXt-XL + 288-Token 4L Off-Policy & 4L On-Policy)

name: pilot_l
family: planner

inputs:
  new_img:            {shape: [2, 6, 128, 256], dtype: uint8, dist: randint, low: 0, high: 256}
  desire:             {shape: [8], dtype: float32, dist: rand, low: 0.0, high: 1.0}
  traffic_convention: {shape: [1, 2], dtype: float32, dist: const, value: [1.0, 0.0]}
  action_t:           {shape: [1, 2], dtype: float32, dist: randn, scale: 0.2}
  state_img_q:        {shape: [2, 5, 6, 128, 256], dtype: uint8, dist: randint, low: 0, high: 256}
  state_desire_q:     {shape: [132, 1, 8], dtype: float32, dist: rand, low: 0.0, high: 1.0}
  state_feat_q:       {shape: [128, 1, 16384], dtype: float32, dist: randn, scale: 0.5}

outputs:
  outputs:             20.outputs
  next_state_img_q:    0.next_img_q
  next_state_desire_q: 0.next_desire_q
  next_state_feat_q:   20.next_state_feat_q

backbone:
  # Rolling Queue Preprocessing
  - [[new_img, desire, state_img_q, state_desire_q, state_feat_q], 1, QueuePreproc, [32]]  # 0

  # ConvNeXt-XL Vision Backbone (24ch dual-cam -> [1, 32, 512])
  - [0.img_norm, 1,  ConvNeXtStem,  [24, 256, 1.0e-5]]            # 1  - Stem P2/4
  - [-1,         3,  ConvNeXtBlock, [256, 4, 1.0e-5]]             # 2  - Stage 0 (3 blocks)
  - [-1,         1,  ConvNeXtDown,  [256, 512, 1.0e-5]]           # 3  - Downsample P3/8
  - [-1,         3,  ConvNeXtBlock, [512, 4, 1.0e-5]]             # 4  - Stage 1 (3 blocks)
  - [-1,         1,  ConvNeXtDown,  [512, 1024, 1.0e-5]]          # 5  - Downsample P4/16
  - [-1,         27, ConvNeXtBlock, [1024, 4, 6.25e-7]]           # 6  - Stage 2 (27 blocks)
  - [-1,         1,  ConvNeXtDown,  [1024, 2048, 6.25e-7]]        # 7  - Downsample P5/32
  - [-1,         3,  ConvNeXtBlock, [2048, 4, 1.0e-5]]            # 8  - Stage 3 (3 blocks)
  - [-1,         1,  ConvNeXtHead,  [2048, 512, 1.0e-5]]          # 9  - Norm + 1x1 [1, 32, 512]
  - [[0.hist_feats, 9], 1, VisionSeqCat, [9]]                     # 10 - Temporal window [1, 9, 32, 512]

head:
  # Single-Frame Spatial Policy
  - [9, 1, PointPolicy, [512]]                                    # 11 - lanes, road_edges, meta, pose

  # Off-Policy Temporal Transformer (4L Causal QK-Norm)
  - [[10, 0.desire_win, traffic_convention, action_t], 1, TemporalEmbed, [32, 200, 512, 9]]  # 12
  - [-1, 4, QKNormBlock, [512, 8, 2.0, true, 288]]                # 13 - 4L causal attention
  - [-1, 1, LastToken,   []]                                      # 14 - Final temporal token
  - [-1, 1, TemporalHydra, [[[plan, 990, true], [lead, 144, true], [lead_prob, 3, false], [desire_state, 8, false]], 512]]  # 15

  # On-Policy Temporal Transformer (4L Causal QK-Norm + Direct Action)
  - [[10, 0.desire_win, traffic_convention, action_t], 1, TemporalEmbed, [32, 200, 512, 9]]  # 16
  - [-1, 4, QKNormBlock, [512, 8, 2.0, true, 288]]                # 17 - 4L causal attention
  - [-1, 1, LastToken,   []]                                      # 18 - Final temporal token
  - [-1, 1, TemporalHydra, [[[action, 4, true]], 512]]            # 19 - Direct 4-d action

  # Output Packing & Feature Queue Shift
  - [[11, 15, 19, 9, state_feat_q], 1, SupercomboPack, [32, false]]  # 20
