# EoMT-Large Semantic Driving Segmentation (DINOv2 ViT-L 316M, CVPR 2025, MIT)

name: seg_l
family: perception

scale: full
scales:
  tiny: { dim: 64, heads: 4, base_depth: 2, query_depth: 1, queries: 16, grid: 8, h: 128, w: 128 }
  full: { dim: 1024, heads: 16, base_depth: 20, query_depth: 4, queries: 100, grid: 64, h: 512, w: 896 }

inputs:
  image: { shape: [1, 3, h, w], dtype: float32 }

backbone:
  - [image, 1, EomtEmbed, [dim, 16, grid, 4]]
  - [-1, base_depth, EomtBlock, [dim, heads, 4]]

head:
  - [-1, 1, EomtQueryConcat, [queries, dim]]
  - [-1, query_depth, EomtBlock, [dim, heads, 4]]
  - [[-1, image], 1, EomtHead, [dim, queries, 19, 16, 4, 2]]

outputs:
  mask: 4
